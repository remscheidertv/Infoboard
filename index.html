<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe src="boardFrame" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

    <script>
        // HIER DEINE PRÄSENTATION EINTRAGEN
        const PRESENTATION_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pub?start=true&loop=true&delayms=30000";
        
        // Intervall für den erzwungenen Neustart der Seite (z.B. alle 120 Minuten / 2 Stunden)
        const RELOAD_MINUTES = 120;

        // URL in den Iframe laden
        document.getElementById('boardFrame').src = PRESENTATION_URL;

        // Regelmäßiger Komplett-Reload, damit der Speicher des TVs sauber bleibt
        setTimeout(function() {
            location.reload();
        }, RELOAD_MINUTES * 60 * 1000);
    </script>
</body>
</html>
