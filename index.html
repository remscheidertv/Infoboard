<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoboard Remscheider Turnverein</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Container schneidet alle überstehenden Canva-Leisten ab */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* iFrame vergrößert und verschoben, um obere und untere Leisten wegzuschneiden */
        iframe {
            position: absolute;
            top: -6vh;
            left: 0;
            width: 100vw;
            height: 112vh;
            border: none;
            z-index: 2;
        }

        /* Lokales Fallback-Bild aus dem GitHub-Repository */
        #default-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Lokales Fallback-Bild auf GitHub -->
    <img id="default-image" src="RTV-ZOOM-Bakcground.jpg" alt="Remscheider Turnverein Default Board" />

    <!-- Canva iFrame mit direktem Präsentations-Link -->
    <div class="iframe-container" id="iframe-box" style="display: none;">
        <iframe 
            id="canva-frame"
            src="https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?utm_content=DAHYp2BSPNE&utm_campaign=designshare&utm_medium=link&utm_source=viewer" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

    <script>
        const canvaUrl = "https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?utm_content=DAHYp2BSPNE&utm_campaign=designshare&utm_medium=link&utm_source=viewer";
        const iframeBox = document.getElementById('iframe-box');
        const defaultImg = document.getElementById('default-image');

        // Prüfen, ob die Canva-URL erreichbar ist
        fetch(canvaUrl, { method: 'HEAD', mode: 'no-cors' })
            .then(response => {
                defaultImg.style.display = 'none';
                iframeBox.style.display = 'block';
            })
            .catch(error => {
                console.log("Canva nicht erreichbar, zeige Fallback-Bild.");
            });

        // Sicherheits-Timer: Falls das Laden länger als 5 Sekunden dauert
        setTimeout(() => {
            if (iframeBox.style.display === 'none') {
                defaultImg.style.display = 'block';
            }
        }, 5000);

        // Automatischer Neuladevorgang jede Stunde (3.600.000 ms)
        setTimeout(() => {
            window.location.reload(true);
        }, 3600000);
    </script>
</body>
</html>
