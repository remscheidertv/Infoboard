<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }
        #iframeWrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }
        /* Iframe füllt wieder den gesamten Bildschirm aus */
        #slidesFrame {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Der Balken legt sich dank z-index: 10 absolut ÜBER das Iframe am unteren Rand */
        #customBottomBar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 45px;
            background-color: #002b5c; /* Vereinsfarbe (Blau) – anpassbar (#000000 für Schwarz) */
            color: #ffffff;
            display: flex;
            align-items: center;
            z-index: 10; /* Zwingt den Balken in den Vordergrund über das Iframe */
            overflow: hidden;
            border-top: 2px solid #ffcc00; /* Optionaler gelber Akzentstrich */
        }

        /* Styling für den Lauftext */
        .marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 25s linear infinite; /* Geschwindigkeit (je kleiner, desto schneller) */
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>

    <div id="iframeWrapper">
        <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        
        <!-- Dieser Balken schwebt nun direkt über dem Iframe am unteren Bildschirmrand -->
        <div id="customBottomBar">
            <div class="marquee-container">
                <span class="marquee-text">
                    📢 Nächster Erste-Hilfe-Kurs am DRK-Kurstermin beachten! &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
                    Bei Fragen an den Sportbereich wenden &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
                    Viel Spaß im Training beim RTV!
                </span>
            </div>
        </div>
    </div>

    <script>
        // Konfiguration
        const SLIDES_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pubembed?start=true&loop=true&delayms=30000";
        const RELOAD_INTERVAL_MINUTES = 60;

        // Präsentations-URL in das Iframe laden
        document.getElementById('slidesFrame').src = SLIDES_URL;

        // Automatischer Reload der Seite nach einer Stunde (verhindert Speicherlecks)
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
