<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #iframeWrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }
        #slidesFrame {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="iframeWrapper">
        <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    </div>

    <script>
        // Konfiguration
        const SLIDES_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pubembed?start=true&loop=true&delayms=30000";
        const RELOAD_INTERVAL_MINUTES = 60;

        // Präsentations-URL direkt in das Iframe laden
        document.getElementById('slidesFrame').src = SLIDES_URL;

        // Automatischer Reload der Seite nach der angegebenen Stundenzahl (verhindert Speicherlecks)
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
