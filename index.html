<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* Vollbild-Darstellung ohne Skalierungs-F Verzerrungen */
        iframe {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }
        /* Fallback-Bild Container bei Verbindungsausfall */
        #fallbackContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #fallbackContainer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

    <!-- Notfall-Bild bei Ladeproblemen / Internet-Ausfall -->
    <div id="fallbackContainer">
        <img id="fallbackImg" src="" alt="Infoboard offline">
    </div>

    <script>
        // 1. GOOGLE SLIDES URL MIT ANGEPASSTEM PARAMETER FÜR VOLLBILD
        const SLIDES_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pub?start=true&loop=true&delayms=30000";

        // 2. DEIN NOTFALL-BILD
        const FALLBACK_IMAGE_URL = "RTV-ZOOM-Bakcground.jpg"; 

        // 3. SEITEN-RELOAD INTERVALL IN MINUTEN
        const RELOAD_INTERVAL_MINUTES = 60;

        const iframe = document.getElementById('slidesFrame');
        const fallback = document.getElementById('fallbackContainer');
        const fallbackImg = document.getElementById('fallbackImg');

        let isLoaded = false;

        // URL in das Iframe einfügen
        iframe.src = SLIDES_URL;

        // Bei erfolgreichem Laden Fallback verbergen
        iframe.onload = function() {
            isLoaded = true;
            fallback.style.display = 'none';
        };

        // Sicherheits-Timer: Wenn nach 10 Sekunden nichts geladen ist, Notfallbild zeigen
        setTimeout(function() {
            if (!isLoaded) {
                fallbackImg.src = FALLBACK_IMAGE_URL;
                fallback.style.display = 'flex';
            }
        }, 10000);

        // Automatischer Reload im Hintergrund
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
