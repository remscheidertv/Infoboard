<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }
        
        /* Das Iframe füllt den Bildschirm aus, hört aber exakt 45px vor dem Boden auf */
        #slidesFrame {
            width: 100vw;
            height: calc(100vh - 45px);
            border: 0;
            display: block;
        }
        
        /* Der untere Balken sitzt fest im freien Bereich am Boden */
        #customBottomBar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 45px;
            background-color: #002b5c; /* Vereinsfarbe Blau – anpassbar */
            color: #ffffff;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-top: 2px solid #ffcc00; /* Gelber Akzentstrich */
        }

        /* Styling für den Lauftext */
        .marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 25s linear infinite; /* Geschwindigkeit (kleiner = schneller) */
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>

    <!-- Präsentation im oberen Bereich -->
    <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    
    <!-- Eigener unterer Balken mit Lauftext im freien Bereich -->
    <div id="customBottomBar">
        <div class="marquee-container">
            <span class="marquee-text">
                📢 Nächster Erste-Hilfe-Kurs am DRK-Kurstermin beachten! &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
                Bei Fragen an den Sportbereich wenden &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
                Viel Spaß im Training beim RTV!
            </span>
        </div>
    </div>

    <script>
        // Konfiguration
        const SLIDES_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pubembed?start=true&loop=true&delayms=30000";
        const RELOAD_INTERVAL_MINUTES = 60;

        // Präsentations-URL laden
        document.getElementById('slidesFrame').src = SLIDES_URL;

        // Automatischer Reload nach einer Stunde
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
