<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoboard Remscheider Turnverein</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Container schneidet die untere Canva-Statusleiste ab */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Skaliert das iFrame auf 106vh, um den Canva-Balken unten herauszuschieben */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 106vh;
            border: none;
            z-index: 2;
        }

        /* Lokales Fallback-Bild aus dem GitHub-Repository */
        #default-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Lokales Fallback-Bild auf GitHub -->
    <img id="default-image" src="RTV-ZOOM-Bakcground.jpg" alt="Remscheider Turnverein Default Board" />

    <!-- Canva iFrame mit neuem Design, Autoplay, Loop & Fit-Modus -->
    <div class="iframe-container">
        <iframe 
            id="canva-frame"
            src="https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?embed&autoplay=1&loop=1&mode=fit" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen"
            onload="hideDefaultImage()">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('canva-frame');
        const defaultImg = document.getElementById('default-image');
        let loaded = false;
        
        // Blendet das Fallback-Bild aus, sobald das iFrame geladen ist
        function hideDefaultImage() {
            loaded = true;
            defaultImg.style.display = 'none';
        }

        // Falls das iFrame nach 4 Sekunden nicht lädt, bleibt das Fallback-Bild sichtbar
        setTimeout(() => {
            if (!loaded) {
                iframe.style.display = 'none';
                defaultImg.style.display = 'block';
            }
        }, 4000);

        // Automatischer Neuladevorgang jede Stunde (3.600.000 ms)
        setTimeout(() => {
            window.location.reload(true);
        }, 3600000);
    </script>
</body>
</html>
