<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoboard Remscheider Turnverein</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Container schneidet den unteren Canva-Balken ab */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Skaliert das iFrame leicht höher, um die Statusleiste herauszuschieben */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 106vh; /* 6% höher gegen die Canva-Navigationsleiste */
            border: none;
            z-index: 2;
        }

        /* Fallback-Bild, falls Canva nicht/verzögert lädt */
        #default-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Default-/Fallback-Bild -->
    <img id="default-image" src="https://via.placeholder.com/1920x1080/000000/ffffff?text=Remscheider+Turnverein+Infoboard" alt="Default Infoboard" />

    <!-- Canva iFrame mit Fit-Mode, Autoplay & Loop -->
    <div class="iframe-container">
        <iframe 
            id="canva-frame"
            src="https://www.canva.com/design/DAHYp2BSPNE/I5b7pjczp5wr3wBzGigByw/view?embed&autoplay=1&loop=1&mode=fit" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen"
            onload="hideDefaultImage()">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('canva-frame');
        const defaultImg = document.getElementById('default-image');
        let loaded = false;
        
        // Blendet das Default-Bild aus, sobald das iFrame vollständig geladen ist
        function hideDefaultImage() {
            loaded = true;
            defaultImg.style.display = 'none';
        }

        // Falls das iFrame nach 4 Sekunden nicht geladen hat, bleibt/wird das Fallback-Bild angezeigt
        setTimeout(() => {
            if (!loaded) {
                iframe.style.display = 'none';
                defaultImg.style.display = 'block';
            }
        }, 4000);

        // Automatischer Reload 1x pro Stunde (3.600.000 Millisekunden)
        setTimeout(() => {
            window.location.reload(true);
        }, 3600000);
    </script>
</body>
</html>
