<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <p>Infoboard wird geladen...</p>

    <script>
        // =========================================================
        // EINSTELLUNGEN - HIER BEARBEITEN
        // =========================================================
        
        // 1. Die URL deiner Google Präsentation (oder jeder anderen Ziel-Seite)
        const PRESENTATION_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pub?start=true&loop=true&delayms=30000";
        
        // 2. Aktualisierungsintervall in Minuten
        const REFRESH_MINUTES = 5;

        // =========================================================
        // AUTOMATISCHE AUSFÜHRUNG (NICHTS ÄNDERN NOTWENDIG)
        // =========================================================
        
        // Sofortige Weiterleitung beim ersten Aufruf
        window.location.href = PRESENTATION_URL;

        // Automatische Aktualisierung nach Ablauf der eingestellten Minuten
        setTimeout(function() {
            window.location.href = PRESENTATION_URL;
        }, REFRESH_MINUTES * 60 * 1000);
    </script>
</body>
</html>
