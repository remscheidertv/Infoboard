<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoboard Remscheider Turnverein</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Container schneidet die untere Canva-Statusleiste ab */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Skaliert das iFrame auf 106vh, um den Canva-Balken unten herauszuschieben */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 106vh;
            border: none;
            z-index: 2;
        }

        /* Lokales Fallback-Bild aus dem GitHub-Repository */
        #default-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Lokales Fallback-Bild auf GitHub -->
    <img id="default-image" src="RTV-ZOOM-Bakcground.jpg" alt="Remscheider Turnverein Default Board" />

    <!-- Canva iFrame -->
    <div class="iframe-container" id="iframe-box" style="display: none;">
        <iframe 
            id="canva-frame"
            src="https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?embed&autoplay=1&loop=1&mode=fit" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

    <script>
        const canvaUrl = "https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?embed";
        const iframeBox = document.getElementById('iframe-box');
        const defaultImg = document.getElementById('default-image');
        const iframe = document.getElementById('canva-frame');

        // Prüfen, ob die Canva-URL erreichbar ist (Abfang von 403, 404 etc.)
        fetch(canvaUrl, { method: 'HEAD', mode: 'no-cors' })
            .then(response => {
                // Bei no-cors erhalten wir meist einen status 0, wenn die Verbindung klappt.
                // Wir zeigen das iFrame an, da der Server erreichbar ist.
                defaultImg.style.display = 'none';
                iframeBox.style.display = 'block';
            })
            .catch(error => {
                // Bei Netzwerkfehlern oder Blockaden bleibt das Fallback-Bild aktiv
                console.log("Canva nicht erreichbar, zeige Fallback-Bild.");
            });

        // Zusätzlicher Sicherheits-Timer (Falls das Laden länger als 5 Sekunden dauert)
        setTimeout(() => {
            if (iframeBox.style.display === 'none') {
                defaultImg.style.display = 'block';
            }
        }, 5000);

        // Automatischer Neuladevorgang jede Stunde (3.600.000 ms)
        setTimeout(() => {
            window.location.reload(true);
        }, 3600000);
    </script>
</body>
</html>
