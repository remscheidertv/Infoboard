<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: relative;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        /* Unsichtbares Schild (Cover), das die untere Google-Leiste perfekt abdeckt */
        #leistenAbdeckung {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 45px; /* Höhe der Google-Leiste */
            background-color: #000000; /* Schwarz, damit es zum Rand passt */
            z-index: 5;
            pointer-events: none; /* Klicks gehen durch, falls nötig */
        }
        /* Fallback-Bild Container */
        #fallbackContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #fallbackContainer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

    <!-- Deckt die Google-Leiste unten komplett ab -->
    <div id="leistenAbdeckung"></div>

    <!-- Notfall-Bild bei Ladeproblemen / Internet-Ausfall -->
    <div id="fallbackContainer">
        <img id="fallbackImg" src="" alt="Infoboard offline">
    </div>

    <script>
        // 1. GOOGLE SLIDES EMBED-LINK
        const SLIDES_EMBED_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/embed?start=true&loop=true&delayms=10000&rm=minimal";

        // 2. NAME DES NOTFALL-BILDES
        const FALLBACK_IMAGE_URL = "RTV-ZOOM-Bakcground.jpg"; 

        // 3. SEITEN-RELOAD INTERVALL IN MINUTEN
        const RELOAD_INTERVAL_MINUTES = 60;

        const iframe = document.getElementById('slidesFrame');
        const fallback = document.getElementById('fallbackContainer');
        const fallbackImg = document.getElementById('fallbackImg');

        let isLoaded = false;

        // URL in das Iframe einfügen
        iframe.src = SLIDES_EMBED_URL;

        // Bei erfolgreichem Laden Fallback ausblenden
        iframe.onload = function() {
            isLoaded = true;
            fallback.style.display = 'none';
        };

        // Sicherheits-Timer: Wenn nach 10 Sek. kein erfolgreicher Load erfolgt, Notfall-Bild zeigen
        setTimeout(function() {
            if (!isLoaded) {
                fallbackImg.src = FALLBACK_IMAGE_URL;
                fallback.style.display = 'flex';
            }
        }, 10000);

        // Automatischer Reload im Hintergrund
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
