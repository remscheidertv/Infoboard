<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="slidesFrame" src="" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

    <script>
        // 1. ERSETZE DIESE URL MIT DEINEM GOOGLE SLIDES EMBED-LINK (/embed?...)
        const SLIDES_EMBED_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/embed?start=true&loop=true&delayms=10000";

        // 2. ZEIT IN MINUTEN FÜR DEN AUTOMATISCHEN SEITEN-RELOAD (Verhindert Abstürze/Speicherprobleme)
        const RELOAD_INTERVAL_MINUTES = 60;

        // URL in den Iframe einsetzen
        document.getElementById('slidesFrame').src = SLIDES_EMBED_URL;

        // Automatischer Reload der Seite im Hintergrund
        setTimeout(function() {
            location.reload();
        }, RELOAD_INTERVAL_MINUTES * 60 * 1000);
    </script>
</body>
</html>
