<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Infoboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Die Präsentation wird sauber im Rahmen eingebettet -->
    <iframe id="boardFrame" src="" allowfullscreen="true"></iframe>

    <script>
        // =========================================================
        // EINSTELLUNGEN
        // =========================================================
        const PRESENTATION_URL = "https://docs.google.com/presentation/d/e/2PACX-1vS6FISkOWah7vDfoTksdmtnKHjcwhseKtcHiUtf38DiKiDWwDJmEZSFkewOLSAytIgkqu7JZndHkYa6/pub?start=true&loop=true&delayms=30000";
        const REFRESH_MINUTES = 5; // Intervall in Minuten

        // URL beim Start in den Iframe laden
        document.getElementById('boardFrame').src = PRESENTATION_URL;

        // Automatischer Reload der Seite nach X Minuten
        setTimeout(function() {
            location.reload();
        }, REFRESH_MINUTES * 60 * 1000);
    </script>
</body>
</html>
