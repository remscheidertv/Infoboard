<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoboard Remscheider Turnverein</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }

        /* 90% Höhe für das Canva-Board oben */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 90vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* iFrame füllt die 90% aus (leicht vergrößert auf 96vh, um den Canva-Balken unten auszublenden) */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 96vh; 
            border: none;
            z-index: 2;
        }

        /* Fallback-Bild im oberen 90%-Bereich, falls Canva nicht lädt */
        #default-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 90vh;
            object-fit: cover;
            z-index: 1;
        }

        /* 10% Höhe für den Lauftext unten */
        .ticker-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 10vh;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-top: 2px solid #333333;
            z-index: 10;
        }

        .ticker-text {
            white-space: nowrap;
            animation: ticker 25s linear infinite;
            font-size: calc(3vh + 1vw);
            font-weight: bold;
            color: #ffcc00;
        }

        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Fallback-Bild (RTV-ZOOM-Bakcground.jpg) -->
    <img id="default-image" src="RTV-ZOOM-Bakcground.jpg" alt="Remscheider Turnverein Default Board" />

    <!-- Canva iFrame mit deinem Original-Embed-Link -->
    <div class="iframe-container" id="iframe-box" style="display: none;">
        <iframe 
            id="canva-frame"
            src="https://www.canva.com/design/DAHYp2BSPNE/sZeaoVpePLgLI1juwcKHUQ/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen"
            loading="lazy"
            onload="showIframe()">
        </iframe>
    </div>

    <!-- 10% Lauftext unten (Hier Text nach Wunsch anpassen) -->
    <div class="ticker-container">
        <div class="ticker-text">
            Herzlich willkommen beim Remscheider Turnverein! &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; Nächste Vorstandssitzung am Dienstag um 19:00 Uhr. &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; Hallenbelegung beachten!
        </div>
    </div>

    <script>
        const iframeBox = document.getElementById('iframe-box');
        const defaultImg = document.getElementById('default-image');
        let isLoaded = false;

        function showIframe() {
            isLoaded = true;
            defaultImg.style.display = 'none';
            iframeBox.style.display = 'block';
        }

        // Sicherheits-Timer: Falls Canva nach 5 Sekunden nicht lädt, bleibt das Fallback-Bild aktiv
        setTimeout(() => {
            if (!isLoaded) {
                iframeBox.style.display = 'none';
                defaultImg.style.display = 'block';
            }
        }, 5000);

        // Automatischer Stündlicher Reload (3.600.000 ms), damit Änderungen frisch geladen werden
        setTimeout(() => {
            window.location.reload(true);
        }, 3600000);
    </script>
</body>
</html>
