<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Ticker Seamless</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffcc00; /* RTV-Gold/Gelb */
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .ticker-wrap {
            width: 100vw;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Nahtlose Animation: Verschiebt exakt um 50%, da der Inhalt gedoppelt ist */
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 35s linear infinite;
            font-size: 5vh;
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker-move" id="ticker">
            Lade aktuelle Vereinsinfos...
        </div>
    </div>

    <script>
        // DEINE GOOGLE SCRIPT WEB-APP URL:
        const GOOGLE_SCRIPT_URL = "HIER_DEINE_WEB_APP_URL_EINFÜGEN";

        function fetchTickerText() {
            // Zeitstempel verhindert 502/Caching-Probleme
            const fetchUrl = GOOGLE_SCRIPT_URL + "?_t=" + new Date().getTime();

            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Netzwerkfehler");
                    return response.json();
                })
                .then(data => {
                    if (data && data.text) {
                        // Fügt ausreichend Abstand an und verdoppelt den Inhalt lückenlos
                        const formattedText = data.text + " &nbsp;&nbsp;&nbsp;&nbsp;+++&nbsp;&nbsp;&nbsp;&nbsp; ";
                        document.getElementById('ticker').innerHTML = formattedText + formattedText;
                    }
                })
                .catch(error => {
                    console.warn("Update übersprungen, behalte aktuellen Text:", error);
                });
        }

        // Beim Start ausführen und alle 3 Minuten erneuern
        fetchTickerText();
        setInterval(fetchTickerText, 180000);
    </script>
</body>
</html>
