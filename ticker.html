<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Ticker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #006;
            color: #fff; /* RTV-Gold/Gelb */
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .ticker-text {
            white-space: nowrap;
            animation: ticker 30s linear infinite;
            font-size: 5vh;
            font-weight: bold;
        }
        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="ticker-text" id="ticker">
        Lade aktuelle Vereinsinfos...
    </div>

    <script>
        // TRAGE HIER DEINE GOOGLE SCRIPT WEB-APP URL EIN:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK6YcCnY1VhG-Hxq_3_Q_djXFHbfdB-jZ1TnxRRc8CCUJhOhUwlgtARC2pyWO3zFLdEA/exec";

        function fetchTickerText() {
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.text) {
                        document.getElementById('ticker').innerHTML = data.text;
                    }
                })
                .catch(error => {
                    console.error("Fehler beim Laden des Tickers:", error);
                });
        }

        // Text beim Start laden
        fetchTickerText();

        // Text alle 60 Sekunden automatisch im Hintergrund aktualisieren
        setInterval(fetchTickerText, 60000);
    </script>
</body>
</html>
