<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Ticker Seamless</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: #ffcc00; /* RTV-Gold/Gelb */
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Container für den fließenden Übergang */
        .ticker-wrap {
            width: 100vw;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 35s linear infinite;
            font-size: 5vh;
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); } /* Verschiebt nur um die Hälfte, da der Text verdoppelt wird */
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker-move" id="ticker">
            Lade aktuelle Vereinsinfos...
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK6YcCnY1VhG-Hxq_3_Q_djXFHbfdB-jZ1TnxRRc8CCUJhOhUwlgtARC2pyWO3zFLdEA/exec";

      function fetchTickerText() {
    // Verhindert aggressive Browser-Caches durch Zeitstempel (?_t=...)
    const fetchUrl = GOOGLE_SCRIPT_URL + "?_t=" + new Date().getTime();

    fetch(fetchUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error("Netzwerk-Antwort war nicht OK: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (data && data.text) {
                const baseText = data.text + " &nbsp;&nbsp;&nbsp;&nbsp;+++&nbsp;&nbsp;&nbsp;&nbsp; ";
                document.getElementById('ticker').innerHTML = baseText + baseText;
            }
        })
        .catch(error => {
            // Bei 502 oder Netzwerkfehlern behält der Ticker stumm den aktuellen Text bei
            console.warn("Ticker-Update übersprungen (Server ausgelastet):", error);
        });
}

        fetchTickerText();
        setInterval(fetchTickerText, 180000); // Alle 60 Sekunden aktualisieren
    </script>
</body>
</html>
